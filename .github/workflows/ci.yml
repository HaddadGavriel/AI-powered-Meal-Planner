name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          { POSTGRES_DB: meal_planner_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      MEAL_PLANNER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/meal_planner_test
      MEAL_PLANNER_JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -e '.[dev]'
      - run: docker build -t meal-planner-api:test .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest
      - run: alembic downgrade base
      - run: alembic upgrade head
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait
      - run: docker compose exec -T api meal-planner-seed
      - run: curl --fail --retry 10 --retry-delay 2 http://localhost:8000/api/v1/health
      - if: always()
        run: docker compose down --volumes
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: npm }
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e
      - run: npm run build
      - run: npm audit --omit=dev
