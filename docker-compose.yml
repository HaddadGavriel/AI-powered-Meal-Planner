services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: meal_planner
      POSTGRES_USER: meal_planner
      POSTGRES_PASSWORD: meal_planner
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meal_planner']
      interval: 2s
      timeout: 3s
      retries: 20
    ports: ['5432:5432']
    volumes: ['meal-planner-postgres:/var/lib/postgresql/data']
  api:
    build: ./backend
    environment:
      MEAL_PLANNER_DATABASE_URL: postgresql+psycopg://meal_planner:meal_planner@db:5432/meal_planner
      MEAL_PLANNER_JWT_SECRET: local-compose-secret-change-before-production
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db: { condition: service_healthy }
    ports: ['8000:8000']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  meal-planner-postgres:
